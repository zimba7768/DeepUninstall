name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --configuration Release

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build app, CLI and installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./installer/build.ps1 -Version $version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "artifacts/installer/DeepUninstall-Setup-$version.exe" dist/
          Copy-Item artifacts/app/DeepUninstall.exe "dist/DeepUninstall-$version-portable-win-x64.exe"
          Compress-Archive -Path artifacts/cli/deepuninstall.exe, LICENSE, README.md -DestinationPath "dist/deepuninstall-cli-$version-win-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
